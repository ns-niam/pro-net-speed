name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build application
        run: |
          pyinstaller --noconfirm --clean --windowed --name NetSpeedMeter --paths src --collect-all PySide6 src/net_speed_meter/main.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetSpeedMeter-Windows
          path: dist/NetSpeedMeter/