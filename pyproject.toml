[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "net-speed-meter"
version = "0.1.0"
description = "A lightweight, real-time internet speed monitor for Windows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Niam Tech" }
]
keywords = [
    "network",
    "internet",
    "speed",
    "monitor",
    "windows",
    "desktop"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "psutil>=6.0,<8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
net-speed-meter = "net_speed_meter.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/net_speed_meter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]